<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MesaYa – Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'DM Sans',sans-serif;background:#f8f7f4;min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .box{background:white;border-radius:22px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,.1);}
        .logo{text-align:center;margin-bottom:32px;}
        .logo-icon{font-size:2.5rem;}
        .logo h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:#1c1917;margin-top:8px;}
        .logo p{color:#78716c;font-size:14px;margin-top:4px;}
        label{display:block;font-weight:600;font-size:13px;color:#44403c;margin:16px 0 6px;}
        input{width:100%;padding:12px 14px;border:1.5px solid #e7e5e4;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;color:#1c1917;transition:border-color .2s;}
        input:focus{outline:none;border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,.1);}
        .btn{margin-top:24px;width:100%;padding:14px;background:#ea580c;color:white;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;}
        .btn:hover{background:#c2410c;}
        .footer-link{text-align:center;margin-top:20px;font-size:14px;color:#78716c;}
        .footer-link a{color:#ea580c;text-decoration:none;font-weight:600;}
        .alert{padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:14px;background:#fee2e2;color:#991b1b;border-left:4px solid #dc2626;}
        .back{display:block;text-align:center;margin-top:12px;font-size:13px;color:#9ca3af;text-decoration:none;}
        .back:hover{color:#ea580c;}
    </style>
</head>
<body>
<div class="box">
    <div class="logo">
        <div class="logo-icon">🍽️</div>
        <h1>MesaYa</h1>
        <p>Inicia sesión para reservar tu mesa</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for category, message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}{% endif %}
    {% endwith %}

    <form method="POST" action="/login-cliente">
        <label>Correo electrónico</label>
        <input type="email" name="email" placeholder="tucorreo@email.com" required autofocus>
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="••••••••" required>
        <button type="submit" class="btn">Iniciar sesión</button>
    </form>

    <div class="footer-link">
        ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate gratis</a>
    </div>
    <a href="{{ url_for('index') }}" class="back">← Ver restaurantes sin cuenta</a>
</div>
</body>
</html>
